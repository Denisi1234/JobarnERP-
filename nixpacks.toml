[phases.setup]
nixPkgs = ["php85", "php85Packages.composer", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm ci"]

[phases.build]
cmds = ["npm run build", "php artisan filament:upgrade"]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=PortalUsersSeeder --force; php artisan serve --host=0.0.0.0 --port=$PORT"
